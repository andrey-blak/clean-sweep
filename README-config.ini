# configuration — inert data, parsed by the script, never executed.
# Full-line comments only (# or ;).

[scan]
# Every listed root is scanned. Quote entries containing commas.
# $HOME and ${VAR:-default} tokens are expanded by the script.
roots = $HOME
# Curated alternative:
# roots = $HOME/.config, $HOME/workspace, $HOME/.cache, $HOME/.claude, $HOME/.docker, $HOME/.gradle, $HOME/.hermes, $HOME/.local, $HOME/.sdkman, $HOME/android, $HOME/Applications
# Env-derived alternative (uses the var if set, else the fallback):
# roots = ${CLAUDE_CONFIG_DIR:-$HOME/.claude}, ${HERMES_HOME:-$HOME/.hermes}, ${ANDROID_HOME:-$HOME/Android/Sdk}

# Never descend into these names (speed only — this key deletes nothing).
exclude = .git, node_modules

# Default age guard in hours: skip dirs modified more recently than this.
min_age_hours = 24

# true = log what would be deleted, delete nothing.
# CLI --dry-run / -n overrides this key (CLI wins).
dry_run = false

[targets]
# key   = name | relative/path | absolute path
#         (quote keys with leading/trailing spaces, e.g. " foo " = empty)
# value = mode[, age_hours]    mode: empty | force
#   bare name     -> matches that basename anywhere
#   relative path -> suffix match: .cc-writes ONLY directly inside .claude
#   absolute path -> that exact location only
#   most specific matching target wins; per-target age overrides min_age_hours
.claude = empty
.hermes = empty
.claude/.cc-writes = force, 6
$HOME/.config/Claude/Code/.cc-writes = force, 6
